site_name: jobseeker-cli docs
site_description: Project documentation for jobseeker-cli
site_url: http://localhost:8000
repo_name: jobseeker-cli

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search

extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Главная: index.md
  - Архитектура:
      - Обзор: architecture/README.md
      - 00 Runtime Contract (Current): architecture/00-runtime-contract.md
      - 01 System Overview: architecture/01-system-overview.md
      - 02 Pipeline Sequence: architecture/02-pipelines-sequence.md
      - 03 Job Details Decision and State: architecture/03-job-details-decision-and-state.md
      - 04 Maintenance Playbook: architecture/04-maintenance-playbook.md
      - 05 Embeddings and LLM Cost Optimization: architecture/05-embeddings-and-llm-cost-optimization-ru.md
      - 06 Embeddings and LLM Cost Optimization (Explained): architecture/06-embeddings-and-llm-cost-optimization-ru-explained.md
      - 07 Local Matching Plan (Beginner): architecture/07-local-matching-plan-ru-beginner.md
      - 08 Local Matching Implementation Plan: architecture/08-local-matching-implementation-plan.md
      - 09 Retrieval Pipeline: architecture/09-retrieval-pipeline.md
      - 10 Vacancy Version State: architecture/10-vacancy-version-state.md
      - 11 Selection Cache State: architecture/11-selection-cache-state.md
      - 12 Top-20 Expansion Logic: architecture/12-top20-expansion-logic.md
      - 13 LLM Context Assembly: architecture/13-llm-context-assembly.md
      - 14 Phase2 Index Builder Step-by-Step: architecture/14-phase2-index-builder-step-by-step-ru.md
      - 15 Embedding Chunking Spec v1: architecture/15-embedding-chunking-spec-v1-ru.md
      - 16 Embedding Chunking Flow Diagram: architecture/16-embedding-chunking-flow-diagram.md
      - 17 Embedding Reindex Decision Diagram: architecture/17-embedding-reindex-decision-diagram.md
      - 18 Canonical Text/Payload/LLM Examples: architecture/18-canonical-text-payload-llm-examples-ru.md
      - 19 Rules Stack Implementation Plan: architecture/19-rules-stack-implementation-plan-ru.md
      - 20 Chunking Runtime Flow: architecture/20-phase2-chunking-runtime-flow.md
      - 21 Chunking System Integration: architecture/21-phase2-chunking-system-integration.md
      - 22 Chunking Smoke Scenarios: architecture/22-chunking-smoke-scenarios.md
      - 23 Retrieval + Rerank Runtime Flow: architecture/23-retrieval-rerank-runtime-flow.md
      - 24 Cache + LLM Handoff Explained: architecture/24-cache-llm-handoff-explained-ru.md
      - 25 Cache/Index Invalidation Overview: architecture/25-cache-index-invalidation-overview-ru.md
  - Smoke Tests:
      - 01 List Collector Retry + Scope: smoke/01-list-collector-retry-and-scope.md
      - 02 Details Collector Prefilter + Backoff: smoke/02-details-collector-prefilter-backoff-write-isolation.md
      - 03 Build Index Active Filter: smoke/03-build-index-active-filter.md
      - 04 Backfill is_active Legacy: smoke/04-backfill-is-active-legacy.md
      - 05 Migrate analysen Profile Index: smoke/05-migrate-analysen-profile-index.md
      - 06 Analyze Jobs Profile-Scoped: smoke/06-analyze-jobs-profile-scoped.md
  - Operations:
