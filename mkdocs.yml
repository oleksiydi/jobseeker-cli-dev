site_name: jobseeker-cli docs
site_description: Project documentation for jobseeker-cli
site_url: http://localhost:8000
repo_name: jobseeker-cli

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search

extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets

