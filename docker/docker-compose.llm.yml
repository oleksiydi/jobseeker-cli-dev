services:
  llm:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: always
    ports:
      - "127.0.0.1:${LLAMA_CPP_HOST_PORT:-8081}:8080"
    volumes:
      - ../models:/models:ro
    command: >
      -m /models/${LLAMA_CPP_MODEL_FILE:-Qwen3-8B-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8080
      --ctx-size ${LLAMA_CPP_CTX_SIZE:-4096}
      --threads ${LLAMA_CPP_THREADS:-4}
      --batch-size ${LLAMA_CPP_BATCH_SIZE:-256}
      --parallel ${LLAMA_CPP_PARALLEL:-1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
