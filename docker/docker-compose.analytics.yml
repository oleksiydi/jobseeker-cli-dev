services:
  nosqlclient:
    image: ${NOSQLCLIENT_IMAGE:-mongoclient/mongoclient}
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-change_me}@mongo:27017/
    depends_on:
      - mongo

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.56.6}
    restart: always
    ports:
      - "127.0.0.1:3001:3000"   # Metabase доступен только с этой машины: http://localhost:3001
    environment:
      MB_DB_FILE: /metabase-data/metabase.db   # хранение настроек Metabase (H2)
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g       # ограничение памяти JVM (по желанию)
    volumes:
      - ./metabase-data:/metabase-data
    depends_on:
      - mongo
