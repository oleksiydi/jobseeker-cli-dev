services:
  mongo-express:
    image: ${MONGO_EXPRESS_IMAGE:-mongo-express:1.0.2}
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-change_me}@mongo:27017/
      ME_CONFIG_BASICAUTH: ${MONGO_EXPRESS_BASICAUTH:-true}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_BASICAUTH_PASSWORD:-change_me}
    depends_on:
      - mongo

  nosqlclient:
    image: ${NOSQLCLIENT_IMAGE:-mongoclient/mongoclient}
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-change_me}@mongo:27017/
    depends_on:
      - mongo

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.56.6}
    restart: always
    ports:
      - "127.0.0.1:3001:3000"   # Metabase доступен только с этой машины: http://localhost:3001
    environment:
      MB_DB_FILE: /metabase-data/metabase.db   # хранение настроек Metabase (H2)
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g       # ограничение памяти JVM (по желанию)
    volumes:
      - ./metabase-data:/metabase-data
    depends_on:
      - mongo
