version: '3.1'

services:
  mongo:
    image: mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - ./data:/data/db  # Монтирование локальной директории ./data в /data/db в контейнере

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  nosqlclient:
    image: mongoclient/mongoclient
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGO_URL: 'mongodb://root:example@mongo:27017/'

  metabase:
    image: metabase/metabase:latest
    restart: always
    ports:
      - "127.0.0.1:3001:3000"   # Metabase доступен только с этой машины: http://localhost:3001
    environment:
      MB_DB_FILE: /metabase-data/metabase.db   # хранение настроек Metabase (H2)
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g       # ограничение памяти JVM (по желанию)
    volumes:
      - ./metabase-data:/metabase-data
    depends_on:
      - mongo

networks:
  default:
    driver: bridge
